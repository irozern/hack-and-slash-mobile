name: Unity CI Action Debug

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Activate Unity license
        uses: game-ci/unity-activate@v2
        with:
          unityLicenseBase64: ${{ secrets.UNITY_LICENSE }}
          unityVersion: 2021.3.18f1
