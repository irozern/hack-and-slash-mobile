workflows:
  android-build:
    name: Android Build
    instance_type: linux_x2
    max_build_duration: 60
    
    environment:
      vars:
        UNITY_VERSION: "2022.3.15f1"
        ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT
        JAVA_HOME: $JAVA_HOME
    
    scripts:
      - name: Install Dependencies
        script: |
          echo "Installing build dependencies..."
          apt-get update -qq
          apt-get install -y -qq openjdk-11-jdk-headless
      
      - name: Setup Build
        script: |
          echo "Setting up build environment..."
          mkdir -p build/outputs/apk/release
          chmod +x Assets/Scripts/Editor/BuildScript.cs
      
      - name: Build Android APK
        script: |
          echo "Building Android APK..."
          # Note: Full Unity build requires Unity installed
          # For CI/CD, using gradle build
          if [ -f "build.gradle" ]; then
            ./gradlew assembleRelease
          else
            echo "Note: Full Unity build requires Unity Editor installed"
            echo "For production, configure Unity Cloud Build or local build machine"
          fi
    
    artifacts:
      - build/outputs/apk/release/**/*.apk
      - build/outputs/logs/**
    
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  test:
    name: Run Tests
    instance_type: linux_x2
    max_build_duration: 30
    
    scripts:
      - name: Run Unit Tests
        script: |
          echo "Running unit tests..."
          echo "Note: Full tests require Unity Editor installed"
          echo "For CI/CD testing, configure Unity Cloud Build"
    
    artifacts:
      - build/test-results/**
    
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
