workflows:
  android-build:
    name: Android Build
    instance_type: linux
    max_build_duration: 120
    
    environment:
      vars:
        GRADLE_OPTS: "-Xmx1024m"
    
    scripts:
      - name: Install Dependencies
        script: |
          echo "Installing build dependencies..."
          apt-get update -qq
          apt-get install -y -qq openjdk-11-jdk-headless
      
      - name: Setup Build Directory
        script: |
          echo "Setting up build directory..."
          mkdir -p build/outputs/apk/release
          ls -la
      
      - name: Build Status
        script: |
          echo "Build configuration ready"
          echo "Project: Hack & Slash Mobile"
          echo "Platform: Android"
          echo "Status: Ready for build"
    
    artifacts:
      - build/outputs/apk/release/**/*.apk
    
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
