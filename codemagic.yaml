workflows:
  android-build:
    name: Android Build
    instance_type: linux_x2
    max_build_duration: 60
    
    environment:
      android_signing:
        - keystore_reference
      vars:
        UNITY_VERSION: "2022.3.15f1"
        ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT
        JAVA_HOME: $JAVA_HOME
    
    scripts:
      - name: Install Unity
        script: |
          # Download Unity Hub
          wget -q https://public.support.unity.com/hub/Editor/UnityHub.AppImage
          chmod +x UnityHub.AppImage
          
          # Install Unity Editor
          ./UnityHub.AppImage -- --headless install --version $UNITY_VERSION --changeset 2ab9c4179ffd
      
      - name: Build Android APK
        script: |
          /opt/unity/Editor/Unity -quit -batchmode -nographics \
            -projectPath . \
            -executeMethod BuildScript.BuildAndroid \
            -logFile -
      
      - name: Sign APK
        script: |
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore $CM_KEYSTORE_PATH \
            -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD \
            build/outputs/apk/release/app-release-unsigned.apk \
            $CM_KEY_ALIAS
          
          # Align APK
          zipalign -v 4 build/outputs/apk/release/app-release-unsigned.apk \
            build/outputs/apk/release/HackSlash-1.0.0.apk
    
    artifacts:
      - build/outputs/apk/release/HackSlash-*.apk
      - build/outputs/logs/**
    
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
      
      slack:
        channel: '#builds'
        notify_on_build_start: true
        notify:
          success: true
          failure: true
      
      google_play:
        credentials: $PLAY_STORE_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 90
    
    environment:
      ios_signing:
        - provisioning_profile_reference
        - certificate_reference
      vars:
        UNITY_VERSION: "2022.3.15f1"
        XCODE_WORKSPACE: "Unity-iPhone.xcworkspace"
    
    scripts:
      - name: Install Unity
        script: |
          # Download Unity Hub
          wget -q https://public.support.unity.com/hub/Editor/UnityHub.AppImage
          chmod +x UnityHub.AppImage
          
          # Install Unity Editor
          ./UnityHub.AppImage -- --headless install --version $UNITY_VERSION --changeset 2ab9c4179ffd
      
      - name: Build iOS XCode Project
        script: |
          /Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity \
            -quit -batchmode -nographics \
            -projectPath . \
            -executeMethod BuildScript.BuildiOS \
            -logFile -
      
      - name: Build iOS App
        script: |
          cd build/iOS
          
          xcodebuild build-for-testing \
            -workspace $XCODE_WORKSPACE \
            -scheme Unity-iPhone \
            -configuration Release \
            -derivedDataPath build
          
          xcodebuild build \
            -workspace $XCODE_WORKSPACE \
            -scheme Unity-iPhone \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/HackSlash.xcarchive \
            -allowProvisioningUpdates
      
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/HackSlash.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
    
    artifacts:
      - build/ipa/HackSlash.ipa
      - build/logs/**
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  test:
    name: Run Tests
    instance_type: linux_x2
    max_build_duration: 30
    
    scripts:
      - name: Run Unit Tests
        script: |
          /opt/unity/Editor/Unity -quit -batchmode -nographics \
            -projectPath . \
            -runTests -testPlatform playmode \
            -testCategory "PlayerStats" \
            -logFile -
      
      - name: Run Integration Tests
        script: |
          /opt/unity/Editor/Unity -quit -batchmode -nographics \
            -projectPath . \
            -runTests -testPlatform playmode \
            -testCategory "Integration" \
            -logFile -
    
    artifacts:
      - build/test-results/**
    
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
